name: Frontend E2E

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LiveEditFronten
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: LiveEditFronten/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            LiveEditFronten/playwright-report/
            LiveEditFronten/test-results/
          if-no-files-found: ignore
